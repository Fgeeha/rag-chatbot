<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Internal RAG Chat</title>
  <script>
    async function sendMessage() {
      const input = document.getElementById('msg');
      const session = localStorage.getItem('session_id') || crypto.randomUUID();
      localStorage.setItem('session_id', session);

      const resp = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: input.value, session_id: session })
      });
      const data = await resp.json();
      appendMessage('user', input.value);
      appendMessage('bot', data.answer);
      input.value = '';
    }
    function appendMessage(role, text) {
      const log = document.getElementById('log');
      const div = document.createElement('div');
      div.className = role;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }
    window.onload = async () => {
      // подгружаем историю, если есть
      const session = localStorage.getItem('session_id');
      if (session) {
        const res = await fetch(`/history/${session}`);
        if (res.ok) {
          const hist = await res.json();
          hist.forEach(m => appendMessage(m.role, m.content));
        }
      }
    };
  </script>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: auto; }
    #log { border: 1px solid #ccc; padding: 10px; height: 60vh; overflow-y: auto; }
    .user { text-align: right; font-weight: bold; margin: 5px 0; }
    .bot { text-align: left; margin: 5px 0; }
    #controls { display: flex; gap: 8px; margin-top: 10px; }
    #msg { flex: 1; }
  </style>
</head>
<body>
  <h1>Internal RAG Chat</h1>
  <div id="log"></div>
  <div id="controls">
    <input id="msg" type="text" placeholder="Ваш вопрос…" onkeydown="event.key==='Enter'&&sendMessage()" />
    <button onclick="sendMessage()">Send</button>
  </div>
</body>
</html>
